name: UP OV Fi
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: {}

jobs:
  update-ovpn:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Remove Old OVPN Files
        run: |
          find . -type f -name "*.ovpn" -exec rm -f {} \;
          git rm -f *.ovpn 2>/dev/null || true

      - name: Download only OVPN files from configs
        run: |
          git clone --filter=blob:none --sparse --depth 1 https://github.com/fdciabdul/Vpngate-Scraper-API.git source-repo
          cd source-repo
          git sparse-checkout set configs
          
          # فایل‌ها رو با نام یکتا (تاریخ + ساعت + ثانیه + شمارنده) منتقل می‌کنیم
          counter=1
          for file in configs/*.ovpn; do
            if [ -f "$file" ]; then
              new_name=\( (date +"%Y%m%d%H%M%S")_ \)(printf "%03d" $counter).ovpn
              mv "$file" "../$new_name"
              echo "Moved: $file → $new_name"
              counter=$((counter + 1))
              sleep 1
            fi
          done
          
          cd ..
          rm -rf source-repo

      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add *.ovpn
          git commit -m "به‌روزرسانی فایل‌های OVPN - $(date +'%Y-%m-%d')" || echo "هیچ تغییری برای کامیت وجود ندارد"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
