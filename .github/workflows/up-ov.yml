name: UP OV Fi
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: {}

jobs:
  update-ovpn:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Remove Old OVPN Files
        run: |
          echo "=== Removing old .ovpn files ==="
          find . -type f -name "*.ovpn" -exec rm -f {} \;
          git rm -f *.ovpn 2>/dev/null || true
          echo "Old files removed."

      - name: Download OVPN from Vpngate-Scraper-API
        run: |
          echo "=== Downloading from Source 1 ==="
          git clone --filter=blob:none --sparse --depth 1 https://github.com/fdciabdul/Vpngate-Scraper-API.git source-repo
          cd source-repo
          git sparse-checkout set configs

          python3 -c '
          import os
          import shutil
          from datetime import datetime

          configs_dir = "configs"
          counter = 1

          if not os.path.exists(configs_dir):
              print("configs folder not found!")
          else:
              files = [f for f in os.listdir(configs_dir) if f.endswith(".ovpn")]
              print(f"Found {len(files)} ovpn files in Source 1")
              
              for filename in sorted(files):
                  src = os.path.join(configs_dir, filename)
                  timestamp = datetime.now().strftime("%Y%m%d%H%M%S")
                  new_name = f"s1_{timestamp}_{counter:03d}.ovpn"
                  dst = os.path.join("..", new_name)
                  shutil.move(src, dst)
                  print(f"[Source1] {new_name}")
                  counter += 1
          '

          cd ..
          rm -rf source-repo
          echo "Source 1 finished."

      - name: Download OVPN from 9xN/auto-ovpn
        run: |
          echo "=== Downloading from Source 2 ==="
          python3 -c '
          import os
          import json
          import base64
          import urllib.request
          from datetime import datetime

          url = "https://raw.githubusercontent.com/9xN/auto-ovpn/main/json/data.json"
          print("Downloading data.json ...")
          
          with urllib.request.urlopen(url) as response:
              data = json.loads(response.read().decode())

          counter = 1
          created = 0
          
          for item in data:
              if not isinstance(item, dict):
                  continue
                  
              servers = item.get("servers", [])
              for server in servers:
                  b64 = server.get("openvpn_configdata_base64")
                  if not b64:
                      continue
                  
                  try:
                      content = base64.b64decode(b64).decode("utf-8", errors="ignore")
                      timestamp = datetime.now().strftime("%Y%m%d%H%M%S")
                      filename = f"s2_{timestamp}_{counter:03d}.ovpn"
                      
                      with open(filename, "w", encoding="utf-8") as f:
                          f.write(content)
                      
                      print(f"[Source2] {filename}")
                      counter += 1
                      created += 1
                  except Exception as e:
                      print(f"Error: {e}")
          
          print(f"Total created from Source 2: {created}")
          '

      - name: Show created files
        run: |
          echo "=== Files currently in repo ==="
          ls -la *.ovpn 2>/dev/null | head -40 || echo "No .ovpn files found"
          echo "..."
          echo "Total .ovpn files:"
          ls *.ovpn 2>/dev/null | wc -l || echo "0"

      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          git add *.ovpn
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "به‌روزرسانی فایل‌های OVPN - $(date +'%Y-%m-%d %H:%M')"
            git push
            echo "Successfully pushed!"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
