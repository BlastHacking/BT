name: UP OV Fi
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: {}

jobs:
  update-ovpn:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Remove Old OVPN Files
        run: |
          find . -maxdepth 1 -type f -name "*.ovpn" -delete
          git rm -f *.ovpn 2>/dev/null || true

      - name: Download from both sources
        run: |
          python3 << 'EOF'
          import os
          import json
          import base64
          import shutil
          import urllib.request
          from datetime import datetime
          from pathlib import Path

          timestamp = datetime.now().strftime("%Y%m%d%H%M%S")

          # ========== Source 1: Vpngate ==========
          print("=== Source 1: Vpngate ===")
          os.system("git clone --filter=blob:none --sparse --depth 1 https://github.com/fdciabdul/Vpngate-Scraper-API.git source-repo")
          os.chdir("source-repo")
          os.system("git sparse-checkout set configs")

          counter = 1
          configs_dir = Path("configs")
          if configs_dir.exists():
              files = sorted([f for f in configs_dir.iterdir() if f.suffix == ".ovpn"])
              print(f"Found {len(files)} files from Source 1")
              for f in files:
                  new_name = f"s1_{timestamp}_{counter:03d}.ovpn"
                  shutil.copy2(f, Path("..") / new_name)
                  print(f"[S1] {new_name}")
                  counter += 1
          os.chdir("..")
          shutil.rmtree("source-repo", ignore_errors=True)

          # ========== Source 2: JSON ==========
          print("\n=== Source 2: JSON ===")
          url = "https://raw.githubusercontent.com/9xN/auto-ovpn/main/json/data.json"
          with urllib.request.urlopen(url) as resp:
              data = json.loads(resp.read().decode())

          counter = 1
          created = 0
          for item in data:
              if not isinstance(item, dict):
                  continue
              for server in item.get("servers", []):
                  b64 = server.get("openvpn_configdata_base64")
                  if not b64:
                      continue
                  try:
                      content = base64.b64decode(b64).decode("utf-8", errors="ignore")
                      new_name = f"s2_{timestamp}_{counter:03d}.ovpn"
                      with open(new_name, "w", encoding="utf-8") as f:
                          f.write(content)
                      print(f"[S2] {new_name}")
                      counter += 1
                      created += 1
                  except Exception as e:
                      print(f"Error: {e}")

          print(f"\nTotal from Source 2: {created}")
          EOF

      - name: Show result
        run: |
          echo "Total .ovpn files:"
          ls *.ovpn 2>/dev/null | wc -l
          echo ""
          echo "Sample names:"
          ls *.ovpn 2>/dev/null | head -15

      - name: Commit and Push
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add *.ovpn
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "به‌روزرسانی فایل‌های OVPN - $(date +'%Y-%m-%d %H:%M')"
            git push
            echo "Pushed successfully"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
