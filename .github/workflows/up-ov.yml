name: UP OV Fi
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: {}

jobs:
  update-ovpn:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Remove Old OVPN Files
        run: |
          find . -type f -name "*.ovpn" -exec rm -f {} \;
          git rm -f *.ovpn 2>/dev/null || true

      - name: Download only OVPN files from configs
        run: |
          git clone --filter=blob:none --sparse --depth 1 https://github.com/fdciabdul/Vpngate-Scraper-API.git source-repo
          cd source-repo
          git sparse-checkout set configs

          python3 -c '
          import os
          import shutil
          from datetime import datetime

          configs_dir = "configs"
          counter = 1

          for filename in sorted(os.listdir(configs_dir)):
              if filename.endswith(".ovpn"):
                  src = os.path.join(configs_dir, filename)
                  timestamp = datetime.now().strftime("%Y%m%d%H%M%S")
                  new_name = f"{timestamp}_{counter:03d}.ovpn"
                  dst = os.path.join("..", new_name)
                  shutil.move(src, dst)
                  print(f"Moved: {filename} → {new_name}")
                  counter += 1
          '

          cd ..
          rm -rf source-repo

      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add *.ovpn
          git commit -m "به‌روزرسانی فایل‌های OVPN - $(date +'%Y-%m-%d')" || echo "هیچ تغییری برای کامیت وجود ندارد"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
